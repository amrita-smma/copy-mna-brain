AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Local SAM template for the two ephemeral Vault email Lambdas and the two
  RSS news-lake Lambdas (rss-poll, rss-enrich). Production deployment is
  managed by Terraform.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 600
    MemorySize: 1024
    Environment:
      Variables:
        DB_HOST: host.docker.internal
        DB_PORT: '5440'
        DB_NAME: mna
        DB_USER: postgres
        RDS_IAM_DB_AUTH: 'false'
        DB_SSL: 'false'
        INTERNAL_API_URL: http://host.docker.internal:3000

Resources:
  VaultArchiveStart:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vault-archive-start
      CodeUri: dist/vault-archive-start/
      Handler: index.handler

  VaultArchivePoll:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vault-archive-poll
      CodeUri: dist/vault-archive-poll/
      Handler: index.handler
      MemorySize: 3008
      EphemeralStorage:
        Size: 4096

  RssPoll:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rss-poll
      CodeUri: dist/rss-poll/
      Handler: index.handler

  RssEnrich:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rss-enrich
      CodeUri: dist/rss-enrich/
      Handler: index.handler

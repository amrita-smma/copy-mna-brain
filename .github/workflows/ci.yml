name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the suite: it takes under a second, and a stale map should
      # not wait on 500+ test files to report.
      #
      # docs/architecture/code-map.md is generated from the filesystem, so a new
      # route/service/repository/agent/job/flag/page makes it stale. Regenerate
      # with `pnpm arch:map` and commit. See .claude/rules/architecture-docs.md.
      - name: Check architecture code map is up to date
        run: pnpm arch:map:check

      - name: Run unit tests
        run: pnpm test

name: Preview DB & Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: preview-db-${{ github.event.number }}
  cancel-in-progress: true

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.number }}

jobs:
  setup:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Use the source branch HEAD (not the GH-synthesized merge commit) so
          # Vercel records the deployment against the correct git branch and
          # picks up the branch-scoped DATABASE_URL.
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Neon branch from main
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run migrations (direct connection)
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:migrate

      - name: Seed database
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:seed

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Set DATABASE_URL on Vercel preview (branch-scoped)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          POOLED_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          # Idempotent: drop any prior branch-scoped value before re-adding.
          vercel env rm DATABASE_URL preview "$BRANCH" --yes --token="$VERCEL_TOKEN" || true
          printf "%s" "$POOLED_URL" | vercel env add DATABASE_URL preview "$BRANCH" --token="$VERCEL_TOKEN"

      - name: Redeploy latest Vercel deployment for commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH: ${{ github.head_ref }}
          PR_ID: ${{ github.event.number }}
        run: |
          # Poll the latest deployment for this branch until it succeeds, then
          # redeploy it so the rebuild picks up the branch-scoped DATABASE_URL
          # set above. Vercel's GitHub integration creates the original deploy
          # but builds it before we can attach the env var.
          for i in $(seq 1 12); do
            RESP=$(vercel list \
              --meta githubCommitRef="$BRANCH" \
              --meta githubPrId="$PR_ID" \
              -F json --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")
            URL=$(echo "$RESP" | jq -r '.deployments[0].url // empty')
            STATE=$(echo "$RESP" | jq -r '.deployments[0].state // empty')

            if [ -z "$URL" ]; then
              echo "Attempt $i: no deployment found for $BRANCH (PR #$PR_ID) yet"
            else
              echo "Attempt $i: latest deployment $URL is $STATE"
              case "$STATE" in
                READY)
                  echo "Redeploying https://$URL"
                  vercel redeploy "https://$URL" --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
                  exit 0
                  ;;
                ERROR|CANCELED)
                  echo "::error::Latest deployment for $BRANCH (PR #$PR_ID) ended in state $STATE; aborting redeploy."
                  exit 1
                  ;;
              esac
            fi

            sleep 10
          done

          echo "::error::Latest deployment for $BRANCH (PR #$PR_ID) did not reach READY within 10 minutes"
          exit 1

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Remove Vercel preview env var
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: vercel env rm DATABASE_URL preview "$BRANCH" --yes --token="$VERCEL_TOKEN" || true

name: Preview DB & Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Manual "Run workflow" button: DESTRUCTIVE reset of the PR's Neon preview
  # branch. Drops every schema, reruns all migrations from scratch, and
  # optionally seeds using the code of the branch the workflow is run from.
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed the database after migrating"
        type: boolean
        default: true

concurrency:
  # head_ref is set for pull_request events; ref_name covers workflow_dispatch,
  # so a manual reset and a push-triggered migrate on the same PR share a group.
  group: preview-db-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.number }}

jobs:
  setup:
    if: github.event.action == 'opened'
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Use the source branch HEAD (not the GH-synthesized merge commit) so
          # Vercel records the deployment against the correct git branch and
          # picks up the branch-scoped DB_* env vars.
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Neon branch from main
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Parse Neon direct URL
        run: |
          RAW="${{ steps.neon.outputs.db_url }}"
          RAW="${RAW#*://}"
          USERINFO="${RAW%%@*}"
          HOSTPART="${RAW#*@}"
          DBPART="${HOSTPART#*/}"
          echo "DB_USER=${USERINFO%%:*}"  >> "$GITHUB_ENV"
          echo "DB_PASSWORD=${USERINFO#*:}" >> "$GITHUB_ENV"
          echo "DB_HOST=${HOSTPART%%/*}"  >> "$GITHUB_ENV"
          echo "DB_PORT=5432"             >> "$GITHUB_ENV"
          echo "DB_NAME=${DBPART%%\?*}"   >> "$GITHUB_ENV"

      - name: Run migrations (direct connection)
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Set DB vars on Vercel preview (branch-scoped)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          RAW="${{ steps.neon.outputs.db_url_pooled }}"
          RAW="${RAW#*://}"
          USERINFO="${RAW%%@*}"
          HOSTPART="${RAW#*@}"
          DBPART="${HOSTPART#*/}"
          P_USER="${USERINFO%%:*}"
          P_PASSWORD="${USERINFO#*:}"
          P_HOST="${HOSTPART%%/*}"
          P_PORT="5432"
          P_NAME="${DBPART%%\?*}"

          for VAR in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD RDS_IAM_DB_AUTH; do
            vercel env rm "$VAR" preview "$BRANCH" --yes --token="$VERCEL_TOKEN" || true
          done

          printf "%s" "$P_HOST"     | vercel env add DB_HOST          preview "$BRANCH" --token="$VERCEL_TOKEN"
          printf "%s" "$P_PORT"     | vercel env add DB_PORT          preview "$BRANCH" --token="$VERCEL_TOKEN"
          printf "%s" "$P_NAME"     | vercel env add DB_NAME          preview "$BRANCH" --token="$VERCEL_TOKEN"
          printf "%s" "$P_USER"     | vercel env add DB_USER          preview "$BRANCH" --token="$VERCEL_TOKEN"
          printf "%s" "$P_PASSWORD" | vercel env add DB_PASSWORD      preview "$BRANCH" --token="$VERCEL_TOKEN"
          printf "%s" "false"       | vercel env add RDS_IAM_DB_AUTH  preview "$BRANCH" --token="$VERCEL_TOKEN"

      - name: Redeploy latest Vercel deployment for commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH: ${{ github.head_ref }}
          PR_ID: ${{ github.event.number }}
        run: |
          # Poll the latest deployment for this branch until it succeeds, then
          # redeploy it so the rebuild picks up the branch-scoped DB_* vars
          # set above. Vercel's GitHub integration creates the original deploy
          # but builds it before we can attach the env vars.
          for i in $(seq 1 60); do
            RESP=$(vercel list \
              --meta githubCommitRef="$BRANCH" \
              --meta githubPrId="$PR_ID" \
              -F json --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")
            URL=$(echo "$RESP" | jq -r '.deployments[0].url // empty')
            STATE=$(echo "$RESP" | jq -r '.deployments[0].state // empty')

            if [ -z "$URL" ]; then
              echo "Attempt $i: no deployment found for $BRANCH (PR #$PR_ID) yet"
            else
              echo "Attempt $i: latest deployment $URL is $STATE"
              case "$STATE" in
                READY)
                  echo "Redeploying https://$URL"
                  vercel redeploy "https://$URL" --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
                  exit 0
                  ;;
                ERROR|CANCELED)
                  echo "::error::Latest deployment for $BRANCH (PR #$PR_ID) ended in state $STATE; aborting redeploy."
                  exit 1
                  ;;
              esac
            fi

            sleep 10
          done

          echo "::error::Latest deployment for $BRANCH (PR #$PR_ID) did not reach READY within 10 minutes"
          exit 1

  migrate:
    if: github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Neon branch connection string
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Parse Neon direct URL
        run: |
          RAW="${{ steps.neon.outputs.db_url }}"
          RAW="${RAW#*://}"
          USERINFO="${RAW%%@*}"
          HOSTPART="${RAW#*@}"
          DBPART="${HOSTPART#*/}"
          echo "DB_USER=${USERINFO%%:*}"    >> "$GITHUB_ENV"
          echo "DB_PASSWORD=${USERINFO#*:}" >> "$GITHUB_ENV"
          echo "DB_HOST=${HOSTPART%%/*}"    >> "$GITHUB_ENV"
          echo "DB_PORT=5432"              >> "$GITHUB_ENV"
          echo "DB_NAME=${DBPART%%\?*}"    >> "$GITHUB_ENV"

      - name: Run migrations
        run: pnpm db:migrate

  teardown:
    if: github.event.action == 'closed'
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Remove Vercel preview env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          for VAR in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD RDS_IAM_DB_AUTH; do
            vercel env rm "$VAR" preview "$BRANCH" --yes --token="$VERCEL_TOKEN" || true
          done

  reset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Resolve Neon branch for this PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No open PR found for branch '$GITHUB_REF_NAME'. Run this workflow from a branch with an open PR (its Neon preview branch is the reset target)."
            exit 1
          fi
          echo "Resetting Neon branch preview/pr-$PR_NUMBER"
          echo "neon_branch=preview/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Neon branch connection string
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.pr.outputs.neon_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Parse Neon direct URL
        run: |
          RAW="${{ steps.neon.outputs.db_url }}"
          RAW="${RAW#*://}"
          USERINFO="${RAW%%@*}"
          HOSTPART="${RAW#*@}"
          DBPART="${HOSTPART#*/}"
          echo "DB_USER=${USERINFO%%:*}"    >> "$GITHUB_ENV"
          echo "DB_PASSWORD=${USERINFO#*:}" >> "$GITHUB_ENV"
          echo "DB_HOST=${HOSTPART%%/*}"    >> "$GITHUB_ENV"
          echo "DB_PORT=5432"              >> "$GITHUB_ENV"
          echo "DB_NAME=${DBPART%%\?*}"    >> "$GITHUB_ENV"

      - name: Drop all schemas
        env:
          DB_RESET_CONFIRM: drop-and-recreate
        run: pnpm db:reset

      - name: Rerun migrations from scratch
        run: pnpm db:migrate

      - name: Seed database
        if: inputs.seed == true
        run: pnpm db:seed

name: Reset DB & Rerun Migrations

# Manually-dispatched, DESTRUCTIVE workflow: drops every schema (all tables and
# the drizzle migration bookkeeping) on a PR's Neon branch, then reruns all
# migrations from scratch. Data is NOT restored — only the schema is rebuilt.
#
# You supply only the PR number. The workflow resolves the PR's git branch (for
# logging/validation) and targets its Neon branch, which by convention is
# `preview/pr-<number>` (see preview-db.yml).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose Neon branch to reset (e.g. 373)'
        required: true
      seed:
        description: 'Seed the database after migrating'
        type: boolean
        default: false

concurrency:
  group: reset-db-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  NEON_BRANCH_NAME: preview/pr-${{ inputs.pr_number }}

jobs:
  reset:
    runs-on: codebuild-mna-brain-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve PR branch
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ -z "$GIT_BRANCH" ]; then
            echo "::error::Could not resolve the checked-out git branch. Aborting."
            exit 1
          fi
          echo "PR #$PR_NUMBER -> git branch '$GIT_BRANCH' -> Neon branch '$NEON_BRANCH_NAME'."
          echo "Resetting Neon branch '$NEON_BRANCH_NAME'."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Neon branch connection string
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Parse Neon direct URL
        run: |
          RAW="${{ steps.neon.outputs.db_url }}"
          RAW="${RAW#*://}"
          USERINFO="${RAW%%@*}"
          HOSTPART="${RAW#*@}"
          DBPART="${HOSTPART#*/}"
          echo "DB_USER=${USERINFO%%:*}"    >> "$GITHUB_ENV"
          echo "DB_PASSWORD=${USERINFO#*:}" >> "$GITHUB_ENV"
          echo "DB_HOST=${HOSTPART%%/*}"    >> "$GITHUB_ENV"
          echo "DB_PORT=5432"              >> "$GITHUB_ENV"
          echo "DB_NAME=${DBPART%%\?*}"    >> "$GITHUB_ENV"

      - name: Drop all schemas
        env:
          DB_RESET_CONFIRM: drop-and-recreate
        run: pnpm db:reset

      - name: Rerun migrations from scratch
        run: pnpm db:migrate

      - name: Seed database
        if: inputs.seed == true
        run: pnpm db:seed

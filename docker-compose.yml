services:
  postgres:
    # pgvector's image is the official postgres image plus the `vector`
    # extension files, so `CREATE EXTENSION vector` works in migrations.
    # Same PG 16 data directory — the existing postgres-data volume is reused.
    image: pgvector/pgvector:pg16
    container_name: mna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mna
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mna"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev / CI.
  # Web console: http://localhost:9001 (admin/admin123)
  # API endpoint: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: mna-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher. UI: http://localhost:8025  SMTP: mailhog:1025
  # App sends via SMTP when SMTP_HOST is set (see `src/lib/ses.ts`).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mna-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # One-shot init: create the mna-files bucket and set a public read policy
  # so presigned URLs work the same way as AWS S3.
  minio-init:
    image: minio/mc:latest
    container_name: mna-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mna-files;
      mc mb --ignore-existing local/mbox-archive;
      mc mb --ignore-existing local/langfuse;
      echo 'buckets mna-files, mbox-archive, and langfuse ready';
      "

  # The app's Redis: the Copilot bots' live state (who is thinking, Stop
  # signals, pushes to the browser). Same shape as production (terraform/redis):
  # no persistence, noeviction. REDIS_URL=redis://localhost:6379 from the host.
  redis:
    image: redis:7
    container_name: mna-redis
    restart: unless-stopped
    command: >
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: mna-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
      mailhog:
        condition: service_started
        required: false
      neo4j:
        condition: service_healthy
        required: false
    env_file:
      - .env.local
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      DB_PORT: 5432
      DB_NAME: mna
      DB_USER: postgres
      DB_PASSWORD: postgres
      RDS_IAM_DB_AUTH: "false"
      NODE_ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: mna-files
      AWS_S3_ENDPOINT: http://minio:9000
      # Presigned URLs must be reachable from the browser, which can't resolve
      # `minio` — expose the host-mapped port instead.
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      # Route transactional email to MailHog instead of AWS SES.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SES_FROM_EMAIL: "Investment Brain <noreply@localhost>"
      # neo4j-driver defaults to bolt://localhost:7687 when unset, which
      # inside this container resolves to the app's own network namespace,
      NEO4J_URI: bolt://neo4j:7687
      # Hardcoded Langfuse internal docker URL
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-1234567890
      LANGFUSE_SECRET_KEY: sk-lf-1234567890
    command: sh -c "CI=true pnpm install && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      # `:z` relabels the bind mount for SELinux (Fedora / RHEL). Harmless on
      # non-SELinux systems. Without it: EACCES on /app/package.json.
      - .:/app:z
      - app-node-modules:/app/node_modules
      - data-pipeline-node-modules:/app/data-pipeline/node_modules
      - app-next-cache:/app/.next

  neo4j:
    image: neo4j:5-community
    container_name: mna-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"   # HTTP browser console
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  langfuse-redis:
    image: redis:7
    container_name: mna-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass myredissecret
      --maxmemory-policy noeviction
    # No host port: Langfuse reaches it by service name, and 6379 on the host
    # is the app's own `redis` service.
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: mna-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9005:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: mna-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3030
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
      SALT: mysalt
      ENCRYPTION_KEY: "73c5d69669a51b815d86a5617c82ad4cab197e5e898e72c2298bf7653645d5ef"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: myredissecret
      NEXTAUTH_SECRET: mysecret
      LANGFUSE_INIT_ORG_ID: "mna-org"
      LANGFUSE_INIT_ORG_NAME: "MNA"
      LANGFUSE_INIT_PROJECT_ID: "mna-project"
      LANGFUSE_INIT_PROJECT_NAME: "MNA Dev"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-1234567890"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-1234567890"
      LANGFUSE_INIT_USER_EMAIL: "test@sqe.co.id"
      LANGFUSE_INIT_USER_NAME: "Test"
      LANGFUSE_INIT_USER_PASSWORD: "password"

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: mna-langfuse-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "3030:3000"
    environment:
      <<: *langfuse-env

volumes:
  postgres-data:
  minio-data:
  neo4j-data:
  app-node-modules:
  data-pipeline-node-modules:
  app-next-cache:
  langfuse-redis-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
